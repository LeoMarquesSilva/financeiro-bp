name: Sync Colaboradores (RH)

on:
  schedule:
    # Horário de Brasília — lista de Usuários atualizada antes do expediente
    - cron: '0 7 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:

concurrency:
  group: sync-colaboradores
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync ORQESTRAI → colaboradores
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORQESTRAI_SUPABASE_URL: ${{ secrets.ORQESTRAI_SUPABASE_URL }}
          ORQESTRAI_SERVICE_ROLE_KEY: ${{ secrets.ORQESTRAI_SERVICE_ROLE_KEY }}
          RESPONSUM_SUPABASE_URL: ${{ secrets.RESPONSUM_SUPABASE_URL }}
          RESPONSUM_SERVICE_ROLE_KEY: ${{ secrets.RESPONSUM_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run sync:colaboradores
