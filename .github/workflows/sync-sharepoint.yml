name: Sync SharePoint (Eficiência)

on:
  schedule:
    # O GitHub só agenda em UTC e ignora fuso. Brasília é UTC−3, sem horário de verão.
    # Minuto 17 foge da fila do minuto 0, que empurrava a carga da manhã para a tarde.
    # 11:17 UTC = 08:17 BRT, 15:17 = 12:17, 17:17 = 14:17, 20:17 = 17:17.
    - cron: '17 11 * * *'
    - cron: '17 15 * * *'
    - cron: '17 17 * * *'
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Fontes (vazio = todas). Ex.: tarefas,tarefas_historico'
        required: false
        default: ''

concurrency:
  group: sync-sharepoint
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync SharePoint → Supabase
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then
            npm run sync:sharepoint -- --only "$ONLY"
          else
            npm run sync:sharepoint
          fi
