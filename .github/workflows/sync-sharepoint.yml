name: Sync SharePoint (Eficiência)

on:
  schedule:
    # Horário de Brasília (IANA — sem conversão manual UTC)
    - cron: '0 8 * * *'
      timezone: America/Sao_Paulo
    - cron: '0 12 * * *'
      timezone: America/Sao_Paulo
    - cron: '0 14 * * *'
      timezone: America/Sao_Paulo
    - cron: '0 17 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:
    inputs:
      only:
        description: 'Fontes (vazio = todas). Ex.: tarefas,tarefas_historico'
        required: false
        default: ''

concurrency:
  group: sync-sharepoint
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync SharePoint → Supabase
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then
            npm run sync:sharepoint -- --only "$ONLY"
          else
            npm run sync:sharepoint
          fi
